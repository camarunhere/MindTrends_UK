services:
  - type: web
    name: mindtrends-uk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: mindtrends_uk
      - key: TRENDS_MODE
        value: auto
      - key: TRENDS_CACHE_TTL_MINUTES
        value: "60"
      - key: TRENDS_REQUEST_TIMEOUT
        value: "15"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: System Administrator

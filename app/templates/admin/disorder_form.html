{% extends "base.html" %}
{% block title %}{{ 'Edit' if disorder else 'Add' }} Disorder{% endblock %}
{% block content %}
<section class="container py-4">
  <div class="dash-shell">
    {% include "admin/_sidebar.html" %}
    <div>
      <a href="{{ url_for('admin.disorders') }}" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to disorders</a>
      <h1 class="h3 mt-2 mb-4">{{ 'Edit' if disorder else 'Add' }} Disorder</h1>

      <div class="panel">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" required value="{{ disorder.name if disorder else '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Description (shown publicly — informational, not diagnostic)</label>
            <textarea name="description" class="form-control" rows="4" required>{{ disorder.description if disorder else '' }}</textarea>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Google Trends Search Term</label>
              <input type="text" name="search_term" class="form-control" value="{{ disorder.search_term if disorder else '' }}" placeholder="Defaults to name if left blank">
            </div>
            <div class="col-md-3">
              <label class="form-label">Category</label>
              <input type="text" name="category" class="form-control" value="{{ disorder.category if disorder else 'Mental Health' }}">
            </div>
            <div class="col-md-3">
              <label class="form-label">Trends Category ID</label>
              <input type="number" name="gtrends_category" class="form-control" value="{{ disorder.gtrends_category if disorder else 0 }}">
            </div>
          </div>
          {% if disorder %}
          <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" name="active" id="activeCheck" {{ 'checked' if disorder.active }}>
            <label class="form-check-label text-muted" for="activeCheck">Visible to visitors and researchers</label>
          </div>
          {% endif %}
          <button type="submit" class="btn btn-gradient mt-4"><i class="bi bi-check2-circle me-2"></i>Save Disorder</button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
